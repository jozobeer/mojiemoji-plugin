[project]
name = "mojiemoji-plugin"
version = "0.12.0"
description = "GitHub Markdown 向け mojiemoji 画像スタンプ — Python 化 skill scripts + PreToolUse hook"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short"

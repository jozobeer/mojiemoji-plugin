[project]
name = "mojiemoji-plugin"
version = "0.12.0"
description = "GitHub Markdown 向け mojiemoji 画像スタンプ — Python 化 skill scripts + PreToolUse hook"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short"

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
include = ["hooks/*", "skills/mojiemoji-github/scripts/*"]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

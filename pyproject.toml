[project]
name = "mojiemoji-plugin"
version = "0.12.0"
description = "GitHub Markdown 向け mojiemoji 画像スタンプ — Python 化 skill scripts + PreToolUse hook"
requires-python = ">=3.10"
dependencies = [
    "mojiemoji",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# The plugin and the published core live in one checkout: `uv run` resolves
# `mojiemoji` from `packages/`, so local development always tests the sources
# a release would ship rather than whatever version is on the index.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mojiemoji = { workspace = true }

[tool.pytest.ini_options]
# Collect both suites — otherwise a change to the published transform could
# merge without its tests ever running.
testpaths = ["tests", "packages/mojiemoji-core/tests"]
python_files = ["test_*.py"]
addopts = "--tb=short"

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = [
    "${MOJIEMOJI_COVERAGE_HOOKS-hooks}",
    "${MOJIEMOJI_COVERAGE_SCRIPTS-skills/mojiemoji-github/scripts}",
    "${MOJIEMOJI_COVERAGE_CORE-packages/mojiemoji-core/src/mojiemoji}",
]
omit = ["tests/*", "packages/*/tests/*", "**/__pycache__/*"]

[tool.coverage.report]
include = [
    "hooks/*",
    "skills/mojiemoji-github/scripts/*",
    "packages/mojiemoji-core/src/mojiemoji/*",
]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

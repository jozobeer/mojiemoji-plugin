# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only prepares notes; publish creates the GitHub Release"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
  # Auto-publish on every main push that touches the plugin version file.
  # `prepare-release-notes.sh` is idempotent: if the resolved tag already
  # has a release, the script silently exits 0 — so unrelated edits to
  # plugin.json (description, author, etc.) that keep the version the
  # same are safe no-ops.
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Prepare release notes
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_MODE: dry-run
        run: bash scripts/prepare-release-notes.sh

      - name: Upload generated notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.notes_file }}
          if-no-files-found: error

      - name: Write job summary
        env:
          MODE: dry-run
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          {
            echo "## Release"
            echo
            echo "- mode: $MODE"
            echo "- tag: $TAG"
            echo "- previous tag: ${PREVIOUS_TAG:-<none>}"
            echo "- tag exists: $TAG_EXISTS"
            echo "- release exists: $RELEASE_EXISTS"
            echo "- target sha: $TARGET_SHA"
            if [ -n "$RELEASE_URL" ]; then
              echo "- release: $RELEASE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  reject-publish-ref:
    name: Reject publish outside main
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "publish mode must run from main"
          exit 1

  publish:
    name: Publish release
    # Runs on (a) manual workflow_dispatch with mode=publish from main, OR
    # (b) push to main that touched .claude-plugin/plugin.json. Both paths
    # invoke the same idempotent prepare-release-notes.sh — version
    # already released → silent skip; new version → tag + release created.
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref == 'refs/heads/main')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          OUTPUT_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_MODE: publish
        run: bash scripts/prepare-release-notes.sh

      - name: Upload generated notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.notes_file }}
          if-no-files-found: error

      - name: Write job summary
        env:
          MODE: publish
          TAG: ${{ steps.release.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          {
            echo "## Release"
            echo
            echo "- mode: $MODE"
            echo "- tag: $TAG"
            echo "- previous tag: ${PREVIOUS_TAG:-<none>}"
            echo "- tag exists: $TAG_EXISTS"
            echo "- release exists: $RELEASE_EXISTS"
            echo "- target sha: $TARGET_SHA"
            if [ -n "$RELEASE_URL" ]; then
              echo "- release: $RELEASE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

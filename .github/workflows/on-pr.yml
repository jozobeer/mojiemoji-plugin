# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest (hook + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pytest-cov pyyaml
      - run: python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  manifest-json:
    name: JSON manifest syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests parse
        run: |
          for f in .claude-plugin/marketplace.json .claude-plugin/plugin.json hooks/hooks.json; do
            echo "checking $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done

  canonical-drift:
    name: Canonical list drift (hook vs parameters.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/verify-lists-vs-docs.sh

  forbid-legacy-bypass:
    name: Forbid legacy bypass marker in new code
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff for legacy bypass marker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          legacy_marker="HOOK""_DISABLE=1"
          if git diff --diff-filter=AM "$BASE_SHA...$HEAD_SHA" -- \
              . \
              ':!README.md' \
              ':!skills/mojiemoji-github/SKILL.md' \
              ':!hooks/mojiemoji-japanese-gate.py' \
              ':!tests/**' \
            | grep -nE "^\+.*${legacy_marker}" ; then
            echo "::error::${legacy_marker} is deprecated. Use MOJIEMOJI_HOOK_DISABLED=1." >&2
            exit 1
          fi

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/verify-lists-vs-docs.sh skills/mojiemoji-github/scripts/verify-lists-vs-service.sh scripts/check-version-bump.sh scripts/prepare-release-notes.sh scripts/audit-harness-skills.sh

  version-bump:
    name: Plugin version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-version-bump.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

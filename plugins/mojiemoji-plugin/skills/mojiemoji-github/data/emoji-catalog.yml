# Mojiemoji trailing-decoration emoji catalog — loaded by SKILL.md
# trailing-decoration rule and helper scripts.
#
# Covers the 162 emoji assets present in upstream
# https://github.com/jozobeer/mojiemoji/tree/main/assets/emoji
# (filename pattern: emoji_u<codepoint>.png).
#
# Emoji NOT in this catalog (e.g. 🚀 = U+1F680) have no upstream
# asset; the mojiemoji service falls back to a static render, so
# use the plain Unicode emoji for those instead.
#
# Each entry follows the same shape as prestamp-catalog.yml:
#
#   "🎉":
#     - animation: patapata
#       font: maru-bold
#       color: "fbbf24"
#       outline: "24fbbf"
#     - animation: kirari
#       ...
#
# Per-variant overrides allowed: font, color, animation, speed,
# background, outline, outline_width. Color-shifting animations
# (disco / psycho / kira) MUST carry outline_width: "0" because
# their hue cycles fight a fixed outline. Rotational animations
# (kaiten / kage_kaiten) MUST carry speed: slow — at the service
# default speed they spin too fast to read.
#
# Canonical font / animation / color values: see
#   skills/mojiemoji-github/references/parameters.md
# Submission-time validation: hooks/mojiemoji_japanese_gate.py

defaults:
  background: transparent
  outline_width: "2"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mojiemoji"
version = "0.1.0"
description = "Turn Japanese Markdown into mojiemoji image stamps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "jozobeer" }]
keywords = ["markdown", "japanese", "emoji", "github", "stamp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://mojiemoji.jozo.beer"
Repository = "https://github.com/jozobeer/mojiemoji-plugin"
Issues = "https://github.com/jozobeer/mojiemoji-plugin/issues"

[project.scripts]
mojiemoji = "mojiemoji.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mojiemoji"]

[tool.hatch.build.targets.sdist]
include = ["src/mojiemoji", "tests", "README.md"]

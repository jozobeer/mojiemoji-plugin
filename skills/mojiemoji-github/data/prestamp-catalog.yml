# Mojiemoji pre-stamp catalog — loaded by skills/mojiemoji-github/scripts/prestamp.rb
#
# To add a new term:
#   1. Append a key under `terms:` (longest match wins — see prestamp.rb).
#   2. Provide 1+ variants; 3+ recommended so the seeded selector can spread
#      flavors across repeated occurrences of the same word.
#   3. Each variant overrides `defaults:` below. Allowed keys per variant:
#        font, color, animation, speed, background, outline, outline_width
#      Color values must be quoted (hex strings like "3b82f6" can be misparsed
#      as numbers if bare).
#
# Canonical font / animation / color values: see
#   skills/mojiemoji-github/references/parameters.md
# Hard validation happens at submission time via hooks/mojiemoji-japanese-gate.py.
# Note: color-shifting animations (kira / disco / psycho) conflict with a
# fixed-color outline. The rendering helper mojiemoji_markdown.rb strips
# outline automatically for those; prestamp.rb currently does not. To
# explicitly suppress the outline on a variant, set `outline: ~` and
# `outline_width: "0"`.

defaults:
  background: transparent
  outline: darker
  outline_width: "2"


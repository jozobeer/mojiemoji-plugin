# Mojiemoji pre-stamp catalog — loaded by skills/mojiemoji-github/scripts/prestamp.rb
#
# To add a new term:
#   1. Append a key under `terms:` (longest match wins — see prestamp.rb).
#   2. Provide 1+ variants; 3+ recommended so the seeded selector can spread
#      flavors across repeated occurrences of the same word.
#   3. Each variant overrides `defaults:` below. Allowed keys per variant:
#        font, color, animation, speed, background, outline, outline_width
#      Hex colors must be quoted ("3b82f6") — bare hex with no letters can
#      misparse as a number.
#
# Outline convention:
#   Each variant carries an explicit `outline:` hex chosen by rotating the
#   fill color's bytes (R,G,B) → (B,R,G), e.g. ef4444 → 44ef44. This gives
#   a complementary halo that differs per variant without leaning on the
#   service's `darker` directive.
#
# Color-shifting animations (kira / disco / psycho) cycle hue across the
# glyph, so a fixed outline fights the effect. Set `outline_width: "0"`
# on those variants to suppress the halo. (The rendering helper
# mojiemoji_markdown.rb strips outline automatically for them; prestamp.rb
# does not, so the suppression is encoded here.)
#
# Canonical font / animation / color values: see
#   skills/mojiemoji-github/references/parameters.md
# Hard validation happens at submission time via hooks/mojiemoji-japanese-gate.py.

